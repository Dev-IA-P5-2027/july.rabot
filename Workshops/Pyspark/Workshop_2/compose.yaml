# Chaîne complète : API randomuser -> Airflow -> Kafka -> Spark Structured Streaming -> Cassandra
# Un seul "docker compose up -d" démarre tout, dans le bon ordre.

services:

  # --- Kafka : la file de messages (mode KRaft, sans ZooKeeper depuis Kafka 4) ---
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Crée le topic une fois Kafka prêt, puis s'arrête
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092",
                 "--create", "--if-not-exists", "--topic", "random_users",
                 "--partitions", "1", "--replication-factor", "1"]
    restart: "no"

  # Interface web pour voir les topics et les messages
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # --- Cassandra : la base de données où arrivent les utilisateurs ---
  cassandra:
    image: cassandra:5.0.8
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Crée le keyspace et la table une fois Cassandra prête, puis s'arrête
  cassandra-init:
    image: cassandra:5.0.8
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  # --- Spark : lit Kafka en continu et écrit dans Cassandra ---
  # Spark 3.5 et non 4.x : le connecteur Cassandra n'existe pas encore pour Spark 4 (voir README)
  spark-streaming:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "4050:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: random_users
      CASSANDRA_HOST: cassandra
      CASSANDRA_KEYSPACE: spark_streaming
      CASSANDRA_TABLE: random_users
      CHECKPOINT_DIR: /opt/spark/work-dir/checkpoint
    volumes:
      - ./spark:/app:ro
      - spark-work:/opt/spark/work-dir
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/opt/spark/work-dir/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9,com.datastax.spark:spark-cassandra-connector_2.12:3.5.1
      - /app/spark_streaming.py
    restart: on-failure

  # --- Airflow : déclenche chaque minute la collecte des utilisateurs vers Kafka ---
  airflow:
    build: ./airflow
    container_name: airflow
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # Pas d'écran de connexion : tout visiteur est administrateur (usage local uniquement)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: random_users
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: standalone

volumes:
  cassandra-data:
  spark-work:
