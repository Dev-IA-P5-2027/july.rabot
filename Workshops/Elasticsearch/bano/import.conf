# Part 1 : ingestion des CSV BANO dans Elasticsearch.
# Le CSV arrive sur stdin, le departement est passe par la variable REGION.
input {
  stdin {
    ecs_compatibility => disabled
  }
}

filter {
  csv {
    ecs_compatibility => disabled
    separator => ","
    columns => ["id", "number", "street_name", "zipcode", "city", "source", "latitude", "longitude"]
    remove_field => ["message", "@version", "@timestamp", "host", "event"]
  }

  # convert et rename dans deux mutate distincts : au sein d'un meme mutate,
  # Logstash execute toujours rename AVANT convert, ce qui laisserait
  # lat/lon en chaines de caracteres.
  mutate {
    convert => {
      "longitude" => "float"
      "latitude" => "float"
    }
  }

  mutate {
    rename => {
      "longitude" => "[location][lon]"
      "latitude" => "[location][lat]"
      "number" => "[address][number]"
      "street_name" => "[address][street_name]"
      "zipcode" => "[address][zipcode]"
      "city" => "[address][city]"
    }
    add_field => { "region" => "${REGION}" }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "bano-${REGION}"
    document_id => "%{[id]}"
    manage_template => false
  }
}
