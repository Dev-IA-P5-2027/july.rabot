# Part 3 : enrichissement d'un jeu de donnees existant.
# Filebeat lit data/person_dataset.csv et l'envoie ici ; chaque personne est
# geolocalisee approximativement, on retrouve son adresse postale exacte dans BANO.
input {
  beats {
    port => 5044
    ecs_compatibility => disabled
  }
}

filter {
  csv {
    ecs_compatibility => disabled
    columns => [
      "id", "name", "dateOfBirth", "gender", "children",
      "[address][city]", "[address][country]", "[address][countrycode]",
      "[location][lat]", "[location][lon]", "[address][zipcode]"
    ]
    convert => {
      "children" => "integer"
      "[location][lat]" => "float"
      "[location][lon]" => "float"
    }
    remove_field => [
      "message", "@version", "@timestamp", "host", "event",
      "agent", "ecs", "input", "log", "tags"
    ]
  }

  # On garde l'adresse approximative d'origine pour pouvoir comparer avant/apres.
  mutate {
    copy => { "[address][city]" => "[input_address][city]" }
    rename => { "[address][zipcode]" => "[input_address][zipcode]" }
  }

  # Strategie la plus lente de la part 2 (tri par geo_distance sur l'alias
  # complet), c'est justement celle que l'article mesure.
  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    query_template => "/usr/share/logstash/bano/search-by-geo.json"
    index => "bano"
    fields => {
      "location" => "[location]"
      "address" => "[address]"
    }
  }
}

output {
  # codec dots : une . par evenement, pour ne pas fausser la mesure de debit.
  stdout { codec => dots }

  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "person-enriched"
    document_id => "%{[id]}"
    manage_template => false
  }
}
