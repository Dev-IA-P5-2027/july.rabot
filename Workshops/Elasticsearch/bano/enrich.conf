# Part 2 : pipeline d'enrichissement.
# On POSTe un document sur http://localhost:8080, Logstash va chercher
# l'adresse correspondante dans les index BANO et complete le document.
input {
  http {
    ecs_compatibility => disabled
    host => "0.0.0.0"
    port => 8080
  }
}

filter {
  mutate {
    remove_field => ["headers", "host", "@version", "event"]
    add_field => { "index_suffix" => "" }
  }

  # Le departement se deduit du code postal : 2 chiffres, sauf outre-mer
  # (codes commencant par 97) ou il en faut 3.
  if [address][zipcode] {
    mutate { add_field => { "dept" => "%{[address][zipcode]}" } }
    truncate {
      fields => ["dept"]
      length_bytes => 2
    }
    if [dept] == "97" {
      mutate { replace => { "dept" => "%{[address][zipcode]}" } }
      truncate {
        fields => ["dept"]
        length_bytes => 3
      }
    }
    mutate { replace => { "index_suffix" => "-%{dept}" } }
  }

  # index_suffix vide => on interroge l'alias "bano" (tous les departements).
  if [location][lat] and [location][lon] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      query_template => "/usr/share/logstash/bano/search-by-geo.json"
      index => "bano%{index_suffix}"
      fields => {
        "location" => "[location]"
        "address" => "[address]"
      }
    }
  } else {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      query_template => "/usr/share/logstash/bano/search-by-name.json"
      index => "bano%{index_suffix}"
      fields => {
        "location" => "[location]"
        "address" => "[address]"
      }
    }
  }

  mutate { remove_field => ["dept", "index_suffix"] }
}

output {
  stdout { codec => rubydebug }
}
